<!-- public/logo-horizontal.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" role="img" aria-label="Portfolio wordmark">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#g)"/>
  <path d="M16 40 L26 32 L34 36 L44 24 L50 28" fill="none" stroke="white" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="44" cy="24" r="2.8" fill="white"/>

  <!-- text -->
  <g transform="translate(74, 18)">
    <text x="0" y="18" font-family="system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif"
          font-size="22" font-weight="700" fill="#ffffff">Portfolio</text>
    <text x="0" y="40" font-family="system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif"
          font-size="18" fill="rgba(255,255,255,0.75)">Accounting</text>
  </g>
</svg>
